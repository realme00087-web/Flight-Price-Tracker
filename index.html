<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroSmart AI</title>
<style>
:root{--bg:#0a1730;--panel:#11244a;--p2:#173061;--line:#2a4278;--txt:#eaf2ff;--mut:#9db3d9;--sky:#4fb3ff;--gold:#e6b655;--em:#2ecc8f;--or:#ff8a3d;--red:#ff7a7a;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#eef4fc;--panel:#fff;--p2:#e3edfa;--line:#c4d4ec;--txt:#0a1730;--mut:#4a6190;--sky:#0a6fc2;--gold:#946a0c;--em:#0f8a5b;--or:#c25a12;--red:#c62f2f;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 30px "Arial Narrow",system-ui,sans-serif;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.note{color:var(--mut);font-size:14px}
.modes{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.modes label{flex-direction:row;align-items:center;gap:6px;color:var(--txt);font-size:16px}
.leg{display:grid;grid-template-columns:1fr 1fr 150px auto;gap:10px;margin-bottom:10px;align-items:end}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:6px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
input,select,button{font:inherit;color:var(--txt);background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
button{cursor:pointer;width:auto}
button.go{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:600;width:100%}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.ac{position:relative}
.ac ul{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:4px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto}
.ac li{padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--txt);font-size:15px}
.ac li[aria-selected=true],.ac li:hover{background:var(--p2)}
.offer{background:#050d1f;color:#eaf2ff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.price{font:700 28px "Arial Narrow",system-ui,sans-serif;color:var(--gold);text-align:right}
.seg{font-size:14px;padding:4px 0;border-top:1px dashed #22365f}
.seg:first-child{border:0}
.seg b{color:#fff}
.meta{grid-column:1/-1;font-size:13px;color:#9db3d9}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin:0 6px 4px 0;border:1px solid currentColor}
.c{color:#2ecc8f}.f{color:#4fb3ff}.v{color:#e6b655}.k{color:#c9a7ff}
.err{color:var(--red)}
@media(max-width:720px){.leg{grid-template-columns:1fr}.offer{grid-template-columns:1fr}.price{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
<h1>AeroSmart AI</h1>
<p class="note">Live fares from the Amadeus Self-Service Flight API.</p>
<form class="panel" id="f" autocomplete="off">
  <div class="modes" role="radiogroup" aria-label="Trip type">
    <label><input type="radio" name="mode" value="oneway" checked> One way</label>
    <label><input type="radio" name="mode" value="round"> Round trip</label>
    <label><input type="radio" name="mode" value="multi"> Multi city</label>
  </div>
  <div id="legs"></div>
  <button type="button" id="add" hidden>Add another flight</button>
  <div class="opts">
    <label>Cabin<select id="cabin"><option value="ECONOMY">Economy</option><option value="PREMIUM_ECONOMY">Premium Economy</option><option value="BUSINESS">Business</option><option value="FIRST">First</option></select></label>
    <label>Passengers<input id="pax" type="number" min="1" max="9" value="1"></label>
    <label>Currency<select id="cur"><option>AED</option><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option></select></label>
    <button class="go" type="submit">Search flights</button>
  </div>
</form>
<div id="out" aria-live="polite"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=s=>String(s||'').toLowerCase().replace(/(^|[\s\-(])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const today=new Date().toISOString().slice(0,10);
let mode='oneway',legs=[];

function label(l){
  const nm=title(l.name),city=title(l.city),ctry=title(l.country);
  return l.type==='CITY'?`${l.code} - ${nm}, ${ctry} (all airports)`:`${l.code} - ${nm}, ${city}, ${ctry}`;
}
function attach(input){
  const wrap=input.parentElement;wrap.classList.add('ac');
  const ul=document.createElement('ul');ul.hidden=true;ul.setAttribute('role','listbox');wrap.appendChild(ul);
  let timer,seq=0;
  input.addEventListener('input',()=>{
    input.dataset.code='';clearTimeout(timer);
    const q=input.value.trim();
    if(!q){ul.hidden=true;return}
    timer=setTimeout(async()=>{
      const mine=++seq;
      try{
        const r=await fetch('/api/airports?q='+encodeURIComponent(q));
        const j=await r.json();if(mine!==seq)return;
        if(!r.ok)throw new Error(j.error);
        ul.innerHTML=j.data.length?j.data.map((l,i)=>`<li role="option" data-i="${i}">${esc(label(l))}</li>`).join(''):'<li>No airports or cities found.</li>';
        ul._d=j.data;ul.hidden=false;
      }catch(e){ul.innerHTML=`<li class="err">${esc(e.message)}</li>`;ul.hidden=false}
    },250);
  });
  ul.addEventListener('mousedown',e=>{
    const li=e.target.closest('li[data-i]');if(!li)return;
    const l=ul._d[li.dataset.i];input.value=label(l);input.dataset.code=l.code;ul.hidden=true;
  });
  input.addEventListener('blur',()=>setTimeout(()=>ul.hidden=true,150));
}
function code(input){
  if(input.dataset.code)return input.dataset.code;
  const v=input.value.trim().toUpperCase();
  return /^[A-Z]{3}$/.test(v)?v:'';
}
function renderLegs(){
  const n=mode==='multi'?Math.max(legs.length,2):1;
  $('#legs').innerHTML=Array.from({length:n},(_,i)=>`<div class="leg">
    <label>From<input class="from" required placeholder="City, airport or code"></label>
    <label>To<input class="to" required placeholder="City, airport or code"></label>
    <label>${i===0?'Depart':'Date'}<input class="date" type="date" required min="${today}"></label>
    ${mode==='multi'&&i>=2?'<button type="button" class="rm" data-i="'+i+'" aria-label="Remove flight">Remove</button>':'<span></span>'}</div>`).join('')
    +(mode==='round'?`<div class="leg"><span></span><span></span><label>Return<input class="ret" type="date" required min="${today}"></label><span></span></div>`:'');
  document.querySelectorAll('.from,.to').forEach(attach);
  $('#add').hidden=mode!=='multi';
}
document.querySelectorAll('[name=mode]').forEach(r=>r.addEventListener('change',()=>{mode=r.value;legs=[];renderLegs()}));
$('#add').onclick=()=>{if(document.querySelectorAll('.leg').length<6){legs.length=document.querySelectorAll('.leg').length+1;renderLegs()}};
$('#legs').addEventListener('click',e=>{if(e.target.classList.contains('rm')){e.target.closest('.leg').remove()}});

const dur=s=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?/.exec(s||'');return m?(+m[1]||0)*60+(+m[2]||0):0};
const fmtDur=m=>`${Math.floor(m/60)}h ${m%60}m`;
const rank={ECONOMY:0,PREMIUM_ECONOMY:1,BUSINESS:2,FIRST:3};
function bags(fd){const b=fd&&fd.includedCheckedBags;if(!b||(!b.quantity&&!b.weight))return 'No checked bag';return b.weight?`${b.weight} ${b.weightUnit||'KG'}`:`${b.quantity} bag${b.quantity>1?'s':''}`}

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const rows=[...document.querySelectorAll('.leg')].filter(r=>r.querySelector('.from'));
  const L=rows.map(r=>({from:code(r.querySelector('.from')),to:code(r.querySelector('.to')),date:r.querySelector('.date').value}));
  if(mode==='round'){const ret=document.querySelector('.ret').value;L.push({from:L[0].to,to:L[0].from,date:ret})}
  const out=$('#out');
  if(L.some(l=>!l.from||!l.to||!l.date)){out.innerHTML='<p class="err">Pick an airport from the list or type a 3-letter code for every From and To.</p>';return}
  out.innerHTML='<p class="note">Searching Amadeus…</p>';
  try{
    const r=await fetch('/api/flights',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({legs:L,adults:+$('#pax').value,cabin:$('#cabin').value,currency:$('#cur').value})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Search failed');
    show(j);
  }catch(err){out.innerHTML=`<p class="err">${esc(err.message)}</p>`}
});

function show({data,dictionaries:d}){
  const out=$('#out');
  if(!data.length){out.innerHTML='<p>No flights found for selected route.</p>';return}
  const offers=data.map(o=>{
    const stops=o.itineraries.reduce((a,i)=>a+i.segments.length-1,0);
    const mins=o.itineraries.reduce((a,i)=>a+dur(i.duration),0);
    const fd=o.travelerPricings[0].fareDetailsBySegment;
    return{o,stops,mins,price:+o.price.grandTotal,cur:o.price.currency,cabin:Math.min(...fd.map(x=>rank[x.cabin]??0)),fd};
  });
  const minP=Math.min(...offers.map(x=>x.price)),minD=Math.min(...offers.map(x=>x.mins));
  const by=(f)=>offers.reduce((a,b)=>f(a)<=f(b)?a:b);
  const tags=new Map(offers.map(x=>[x,[]]));
  tags.get(by(x=>x.price)).push(['c','Cheapest']);
  tags.get(by(x=>x.mins)).push(['f','Fastest']);
  tags.get(by(x=>x.price/minP+x.mins/minD)).push(['v','Best value']);
  tags.get(by(x=>-x.cabin*100+x.stops*10+x.mins/60)).push(['k','Most comfortable']);
  offers.sort((a,b)=>a.price-b.price);
  out.innerHTML=`<p class="note">${offers.length} offers from Amadeus. “Most comfortable” ranks cabin class, then fewest stops, then shortest time; the API has no seat-pitch data.</p>`+offers.map(x=>{
    const its=x.o.itineraries.map(it=>`<div>${it.segments.map(s=>{
      const car=d.carriers&&d.carriers[s.carrierCode]||s.carrierCode,ac=d.aircraft&&d.aircraft[s.aircraft&&s.aircraft.code]||(s.aircraft&&s.aircraft.code)||'n/a';
      return`<div class="seg"><b>${esc(s.departure.iataCode)} ${esc(s.departure.at.slice(11,16))}</b> → <b>${esc(s.arrival.iataCode)} ${esc(s.arrival.at.slice(11,16))}</b> · ${esc(s.departure.at.slice(0,10))} · ${esc(title(car))} ${esc(s.carrierCode+s.number)} · ${esc(title(ac))}</div>`}).join('')}
      <div class="meta">${fmtDur(dur(it.duration))} · ${it.segments.length-1?it.segments.length-1+' stop'+(it.segments.length>2?'s':''):'Nonstop'}</div></div>`).join('');
    const f=x.fd[0];
    return`<div class="offer"><div>${tags.get(x).map(t=>`<span class="tag ${t[0]}">${t[1]}</span>`).join('')}${its}</div>
    <div class="price">${esc(x.cur)} ${x.price.toLocaleString('en-US',{maximumFractionDigits:0})}<div class="note" style="text-align:right">total, all passengers</div></div>
    <div class="meta">Baggage: ${esc(bags(f))} · Fare: ${esc(title(f.brandedFare||f.fareBasis))} · Cabin: ${esc(title(f.cabin.replace('_',' ')))} · Source: Amadeus (${esc(x.o.source)}) · Refundable: not in search data · CO₂: not in search data</div></div>`}).join('');
}
renderLegs();
</script>
</body>
</html>
